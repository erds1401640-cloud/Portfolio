    <style>
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            color: white;
            background: #111;
        }

        .background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .shade {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        main {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        .intro {
            max-width: 650px;
        }

        .small-text {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 28px;
            color: #ddd;
        }

        h1 {
            font-size: clamp(34px, 5vw, 58px);
            font-weight: normal;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .link {
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: white;
            text-decoration: none;
            border-bottom: 1px solid white;
            padding-bottom: 6px;
            transition: opacity 0.2s;
        }

        .link:hover {
            opacity: 0.65;
        }

        .bottom {
            position: absolute;
            bottom: 22px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: #ddd;
        }
    </style>
</head>
